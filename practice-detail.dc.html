<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<template id="__bundler_thumbnail"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><rect width="100" height="100" fill="#0e0e10"/><text x="50" y="58" font-family="Arial,sans-serif" font-size="26" font-weight="bold" fill="#ffffff" text-anchor="middle">LMNG</text></svg></template>
<x-dc>
<helmet>
  <link rel="stylesheet" href="lmng-styles.css">
  <script src="lmng-bundle.js"></script>
  <style>body{margin:0;background:var(--paper-0);font-family:var(--font-body);color:var(--ink-900)} a{color:var(--navy-700)} a:hover{color:var(--navy-900)}
  @media (max-width: 980px){
    nav{display:none!important}
    div[style*="flex: 0 1 180px"]{display:none!important}
  }
  @media (max-width: 900px){
    h1{font-size:36px!important}
    div[style*="grid-template-columns: repeat(4, 1fr)"]{grid-template-columns:repeat(2,1fr)!important}
    div[style*="grid-template-columns: repeat(3, 1fr)"]{grid-template-columns:1fr!important}
    div[style*="grid-template-columns: repeat(6, 1fr)"]{grid-template-columns:repeat(3,1fr)!important}
    div[style*="grid-template-columns: 1fr 340px"],div[style*="grid-template-columns: 1fr 360px"]{grid-template-columns:1fr!important}
    div[style*="grid-template-columns: 320px 1fr"]{grid-template-columns:1fr!important}
    div[style*="grid-template-columns: 1.15fr 1fr"]{grid-template-columns:1fr!important}
    div[style*="grid-template-columns: 1.4fr 1fr 1fr 1.2fr"]{grid-template-columns:1fr 1fr!important}
    div[style*="position: sticky; top: 130px"],div[style*="position: sticky; top: 100px"]{position:static!important}
    h1 span{animation:none!important;opacity:1!important;transform:none!important}
  }
  @media (max-width: 640px){
    h1{font-size:30px!important}
    div[style*="grid-template-columns: repeat(6, 1fr)"]{grid-template-columns:repeat(2,1fr)!important}
    div[style*="grid-template-columns: 1fr 1fr"]{grid-template-columns:1fr!important}
    div[style*="grid-template-columns: 1.4fr 1fr 1fr 1.2fr"]{grid-template-columns:1fr!important}
  }
  @view-transition{navigation:auto}
  ::view-transition-group(site-nav){animation:none}
  ::view-transition-old(site-nav),::view-transition-new(site-nav){animation:none}
  ::view-transition-old(root){animation:none;opacity:0}
  ::view-transition-new(root){animation:vtFade 180ms ease-out}
  @keyframes vtFade{from{opacity:0.55}to{opacity:1}}
  @keyframes pageRise{from{opacity:0;transform:translateY(38px)}to{opacity:1;transform:translateY(0)}}</style>
</helmet>
<div style="min-height: 100vh; display: flex; flex-direction: column">
  <dc-import name="SiteNav" theme="white" active="practice" hint-size="100%,113px"></dc-import>

  <div style="background: var(--navy-900)">
    <div style="max-width: 1240px; margin: 0 auto; padding: 56px 24px 56px">
      <div style="font-size: 13px; color: var(--ink-300)"><a href="home.dc.html" style="color: var(--ink-300); text-decoration: none" style-hover="color: var(--paper-0)">Home</a> &nbsp;/&nbsp; <a href="practice-areas.dc.html" style="color: var(--ink-300); text-decoration: none" style-hover="color: var(--paper-0)">Practice Areas</a> &nbsp;/&nbsp; <span style="color: var(--paper-50)">{{ title }}</span></div>
      <h1 style="animation: pageRise 1300ms cubic-bezier(0.16,1,0.3,1) 100ms both; font-family: var(--font-display); font-size: 48px; font-weight: 700; letter-spacing: -0.02em; line-height: 1.1; margin: 18px 0 0; color: var(--paper-0); max-width: 820px">{{ title }}</h1>
      <p style="animation: pageRise 1300ms cubic-bezier(0.16,1,0.3,1) 400ms both; font-size: 17px; line-height: 1.65; color: var(--ink-200); margin: 16px 0 0; max-width: 640px">{{ intro }}</p>
    </div>
  </div>

  <div style="max-width: 1240px; margin: 0 auto; padding: 64px 24px 88px; width: 100%; box-sizing: border-box; display: grid; grid-template-columns: 1fr 360px; gap: 64px; align-items: start; flex: 1">
    <div>
      <sc-for list="{{ paragraphs }}" as="p" hint-placeholder-count="2">
        <p style="font-size: 16.5px; line-height: 1.75; color: var(--ink-700); margin: 0 0 18px">{{ p }}</p>
      </sc-for>
      <h2 style="font-family: var(--font-display); font-size: 24px; font-weight: 700; letter-spacing: -0.01em; margin: 32px 0 0; color: var(--ink-900)">What we handle</h2>
      <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 20px">
        <sc-for list="{{ services }}" as="s" hint-placeholder-count="8">
          <div style="display: flex; align-items: center; gap: 12px; border: 1px solid var(--ink-100); border-radius: 10px; padding: 15px 18px">
            <span style="width: 6px; height: 6px; border-radius: 9999px; background: var(--brass-500); flex: none"></span>
            <span style="font-size: 14px; font-weight: 500; color: var(--ink-700)">{{ s }}</span>
          </div>
        </sc-for>
      </div>
      <sc-if value="{{ hasExperience }}" hint-placeholder-val="{{ false }}">
        <h2 style="font-family: var(--font-display); font-size: 24px; font-weight: 700; letter-spacing: -0.01em; margin: 48px 0 0; color: var(--ink-900)">Representative experience</h2>
        <div style="display: flex; flex-direction: column; margin-top: 8px">
          <sc-for list="{{ experience }}" as="e" hint-placeholder-count="3">
            <div style="display: flex; gap: 14px; padding: 14px 0; border-bottom: 1px solid var(--ink-100)">
              <span style="width: 6px; height: 6px; border-radius: 9999px; background: var(--brass-500); flex: none; margin-top: 9px"></span>
              <span style="font-size: 15px; line-height: 1.6; color: var(--ink-700)">{{ e }}</span>
            </div>
          </sc-for>
        </div>
      </sc-if>
    </div>

    <div style="position: sticky; top: 130px; border: 1px solid var(--ink-100); border-radius: 14px; padding: 28px; box-shadow: 0 2px 6px rgba(0,0,0,0.04), 0 4px 12px rgba(0,0,0,0.06)">
      <div style="font-size: 13px; font-weight: 600; letter-spacing: 0.14em; text-transform: uppercase; color: var(--brass-700)">Who to talk to</div>
      <div style="display: flex; flex-direction: column; gap: 16px; margin-top: 18px">
        <sc-for list="{{ leads }}" as="l" hint-placeholder-count="2">
          <div style="display: flex; align-items: center; gap: 14px">
            <div style="width: 48px; height: 48px; border-radius: 9999px; background: var(--paper-100); display: flex; align-items: center; justify-content: center; font-family: var(--font-display); font-weight: 700; font-size: 15px; color: var(--ink-300); flex: none">{{ l.initials }}</div>
            <div>
              <a href="{{ l.href }}" style="font-size: 15px; font-weight: 600; color: var(--ink-900); text-decoration: none" style-hover="color: var(--navy-700)">{{ l.name }}</a>
              <div style="font-size: 13px; color: var(--ink-500)">{{ l.role }}</div>
            </div>
          </div>
        </sc-for>
      </div>
      <div style="display: flex; flex-direction: column; gap: 10px; margin-top: 24px">
        <a href="contact.dc.html" style="display: block; text-align: center; background: var(--navy-700); color: var(--paper-0); border-radius: 9999px; padding: 14px 24px; font-size: 15px; font-weight: 600; text-decoration: none" style-hover="background: var(--navy-900)">Schedule a consultation</a>
        <a href="practice-areas.dc.html" style="display: block; text-align: center; border: 1px solid var(--ink-200); color: var(--ink-900); border-radius: 9999px; padding: 13px 24px; font-size: 15px; font-weight: 600; text-decoration: none" style-hover="background: var(--paper-50)">All practice areas</a>
      </div>
    </div>
  </div>

  <dc-import name="SiteFooter" hint-size="100%,420px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  data() {
    const L = {
      lape: { name: 'Rodd B. Lape', role: 'Partner', initials: 'RL', href: 'attorney-profile.dc.html?a=rodd-b-lape' },
      mansfield: { name: 'Douglas M. Mansfield', role: 'Partner', initials: 'DM', href: 'attorney-profile.dc.html?a=douglas-m-mansfield' },
      nakasian: { name: 'William E. Nakasian', role: 'Partner', initials: 'WN', href: 'attorney-profile.dc.html?a=william-e-nakasian' },
      gibson: { name: 'Rick J. Gibson', role: 'Partner', initials: 'RG', href: 'attorney-profile.dc.html?a=rick-j-gibson' },
      carter: { name: 'Dan T. Carter', role: 'Of Counsel', initials: 'DC', href: 'attorney-profile.dc.html?a=dan-t-carter' },
      paynter: { name: 'Sarah Paynter', role: 'Counsel', initials: 'SP', href: 'attorney-profile.dc.html?a=sarah-paynter' }
    };
    return {
      'business-counseling': {
        title: 'Business and Regulatory Counseling',
        intro: 'Day-to-day advice for boards, owners, and executives — from governance to compliance.',
        paragraphs: [
          'Businesses do not stop generating legal questions between transactions. We serve as ongoing counsel to boards, owners and executives — advising on governance, fiduciary duties, contracts, employment arrangements and regulatory compliance so problems are addressed before they become disputes.',
          'Our attorneys bring the judgment of decades at one of the country\u2019s largest firms to the practical, immediate questions of running a business: how to structure a new venture, document a key relationship, retain an executive, or plan for succession.'
        ],
        services: ['Buy-Sell Agreements', 'Contract Drafting & Negotiation', 'Corporate Governance', 'Director & Officer Duties', 'Employment & Non-Compete Arrangements', 'Entity Formation & Selection', 'Executive & Incentive Compensation', 'Seed, Feed & Fertilizer Law Compliance', 'FINRA Compliance & Licensing', 'General Business & Regulatory Advice', 'Franchise & Distribution', 'Litigation Avoidance', 'Succession Planning'],
        experience: [],
        leads: [L.lape, L.gibson, L.paynter]
      },
      'business-transactions': {
        title: 'Business Transactions',
        intro: 'Deal counsel for buyers, sellers, lenders, and investors — from venture financings to multi-hundred-million-dollar acquisitions, domestic and international.',
        paragraphs: [
          'We represent both buyers and sellers and have acted as lead counsel in scores of domestic and international M&A transactions. Our attorneys structure, negotiate, and document complex mergers, acquisitions, dispositions, restructurings, joint ventures, credit facilities, and commercial transactions.',
          'Every client is different — a \u201cone size fits all\u201d approach is not an effective way to deliver deal advice. We tailor structure and negotiation to your business objectives while addressing the legal and business risks that matter.'
        ],
        services: ['Debt & Equity Financing', 'Joint Ventures', 'Management & Leveraged Buy-Outs', 'Mergers, Acquisitions & Dispositions', 'Private Placements', 'Restructurings & Reorganizations', 'Strategic Alliances', 'Stock & Asset Sales & Purchases', 'Venture Capital Financings'],
        experience: [
          'Over $2.5 billion in completed acquisitions of privately held companies in domestic and international jurisdictions.',
          '$1.44 billion sale of equity stake in the Mexican subsidiary of a major Latin American mobile communication provider.',
          '$465 million sale of substantially all assets of a Tier 1 automotive supplier pursuant to a highly contested Section 363 bankruptcy sale.',
          'T-Mobile\u2019s $2.4 billion monetization of over 7,000 towers with Crown Castle.'
        ],
        leads: [L.lape, L.gibson, L.paynter]
      },
      'litigation': {
        title: 'Litigation and Dispute Resolution',
        intro: 'Resolution-focused advocacy in court, arbitration, and mediation — nationwide.',
        paragraphs: [
          'We have tried cases before state and federal courts, administrative agencies, self-regulating organizations and arbitration tribunals around the country, and argued appeals in multiple federal circuits. Our experience spans commercial disputes, securities and broker-dealer matters, franchise and distributor terminations, trade secrets, non-compete disputes and government investigations.',
          'We are resolution-focused: litigation is a tool for achieving your business objective, not an end in itself. Where a negotiated result serves you better, we pursue it; where trial is the answer, we are prepared to try the case.'
        ],
        services: ['Arbitration & Mediation', 'Broker/Dealer & Securities Disputes', 'Complex Litigation', 'Commercial Disputes', 'Employment Disputes', 'Franchise & Distributor Disputes'],
        experience: [
          'National defense of hundreds of dealer arbitrations for General Motors following its bankruptcy.',
          'Multimillion-dollar ISDA derivatives dispute for American Electric Power.',
          'Defense of Japanese auto parts manufacturers in federal criminal antitrust proceedings.',
          'Putative class action defense for First American Title Insurance Company.'
        ],
        leads: [L.mansfield, L.carter]
      },
      'real-estate': {
        title: 'Real Estate and Finance',
        intro: 'Full-cycle real estate counsel — acquisition, development, leasing, and finance.',
        paragraphs: [
          'We advise corporations, developers, equity investors and private equity real estate funds on all aspects of commercial real estate: acquisitions and dispositions, complex joint ventures, senior and mezzanine financings, leasing of every type, public/private partnerships and economic incentive programs.',
          'Our experience includes some of the largest industrial portfolio transactions in the country, nationwide sale-leaseback programs, and tax-incentivized structures including Section 1031 exchanges.'
        ],
        services: ['Acquisitions & Dispositions', 'Corporate Real Estate Services', 'Development & Construction Financing', 'Joint Ventures', 'Office, Industrial & Retail Leasing', 'Real Estate Development', 'Sale-Leaseback Transactions', '1031 Tax-Free Exchanges'],
        experience: [
          '$1.4 billion sale of a core industrial portfolio — 21+ million square feet across 18 cities.',
          'Nationwide sale-leaseback programs exceeding 19 million square feet for a major financial institution.',
          'Sale-leaseback of more than 3,000 cell tower sites for Sprint Nextel.'
        ],
        leads: [L.nakasian]
      },
      'estate-planning': {
        title: 'Estate Planning',
        intro: 'Protecting what owners build — for the next generation.',
        paragraphs: [
          'For business owners, an estate plan and the business itself are inseparable — operating agreements, buy-sell arrangements and trust documents must work together. We design plans that protect assets, provide for families and keep businesses running through transitions.',
          'Our practice covers wills, trusts, powers of attorney and health care directives, together with probate and trust administration and, when necessary, probate litigation.'
        ],
        services: ['Probate & Trust Administration', 'Probate Litigation', 'Trusts, Limited Partnerships & Asset Protection', 'Wills, POAs & Health Care Directives'],
        experience: [],
        leads: [L.paynter, L.lape]
      },
      'general-counsel': {
        title: 'General Counsel Services',
        intro: 'An objective outside general counsel for small businesses — issues, problems, and opportunities, day to day.',
        paragraphs: [
          'Most small and mid-size businesses cannot justify a full-time legal department — but their legal questions are no less real. We serve as outside general counsel: a single, consistent advisor who knows your business and is on call for the issues, problems and opportunities that arise day to day.',
          'The relationship is built for efficiency: predictable arrangements, direct access to experienced attorneys, and advice delivered with the business context already understood.'
        ],
        services: ['Outside General Counsel Retainers', 'Objective Business & Legal Review', 'Vendor & Commercial Contracts', 'Risk & Compliance Check-Ups'],
        experience: [],
        leads: [L.lape, L.gibson]
      }
    };
  }
  renderVals() {
    const slug = new URLSearchParams(window.location.search).get('p') || 'business-transactions';
    const all = this.data();
    const d = all[slug] || all['business-transactions'];
    return { ...d, hasExperience: d.experience.length > 0 };
  }
}
</script>
</body>
</html>
