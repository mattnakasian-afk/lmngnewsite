<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<template id="__bundler_thumbnail"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><rect width="100" height="100" fill="#0e0e10"/><text x="50" y="58" font-family="Arial,sans-serif" font-size="26" font-weight="bold" fill="#ffffff" text-anchor="middle">LMNG</text></svg></template>
<x-dc>
<helmet>
  <link rel="stylesheet" href="lmng-styles.css">
  <script src="lmng-bundle.js"></script>
  <style>body{margin:0;background:var(--paper-0);font-family:var(--font-body);color:var(--ink-900)} a{color:var(--navy-700)} a:hover{color:var(--navy-900)}
  @media (max-width: 980px){
    nav{display:none!important}
    div[style*="flex: 0 1 180px"]{display:none!important}
  }
  @media (max-width: 900px){
    h1{font-size:36px!important}
    div[style*="grid-template-columns: repeat(4, 1fr)"]{grid-template-columns:repeat(2,1fr)!important}
    div[style*="grid-template-columns: repeat(3, 1fr)"]{grid-template-columns:1fr!important}
    div[style*="grid-template-columns: repeat(6, 1fr)"]{grid-template-columns:repeat(3,1fr)!important}
    div[style*="grid-template-columns: 1fr 340px"],div[style*="grid-template-columns: 1fr 360px"]{grid-template-columns:1fr!important}
    div[style*="grid-template-columns: 320px 1fr"]{grid-template-columns:1fr!important}
    div[style*="grid-template-columns: 1.15fr 1fr"]{grid-template-columns:1fr!important}
    div[style*="grid-template-columns: 1.4fr 1fr 1fr 1.2fr"]{grid-template-columns:1fr 1fr!important}
    div[style*="position: sticky; top: 130px"],div[style*="position: sticky; top: 100px"]{position:static!important}
    h1 span{animation:none!important;opacity:1!important;transform:none!important}
  }
  @media (max-width: 640px){
    h1{font-size:30px!important}
    div[style*="grid-template-columns: repeat(6, 1fr)"]{grid-template-columns:repeat(2,1fr)!important}
    div[style*="grid-template-columns: 1fr 1fr"]{grid-template-columns:1fr!important}
    div[style*="grid-template-columns: 1.4fr 1fr 1fr 1.2fr"]{grid-template-columns:1fr!important}
  }
  @view-transition{navigation:auto}
  ::view-transition-group(site-nav){animation:none}
  ::view-transition-old(site-nav),::view-transition-new(site-nav){animation:none}
  ::view-transition-old(root){animation:none;opacity:0}
  ::view-transition-new(root){animation:vtFade 180ms ease-out}
  @keyframes vtFade{from{opacity:0.55}to{opacity:1}}
  @keyframes pageRise{from{opacity:0;transform:translateY(38px)}to{opacity:1;transform:translateY(0)}}</style>
</helmet>
<div style="min-height: 100vh; display: flex; flex-direction: column">
  <dc-import name="SiteNav" theme="white" active="attorneys" hint-size="100%,113px"></dc-import>

  <div style="background: var(--paper-50); border-bottom: 1px solid var(--ink-100)">
    <div style="max-width: 1240px; margin: 0 auto; padding: 40px 24px 48px">
      <div style="font-size: 13px; color: var(--ink-500)"><a href="home.dc.html" style="color: var(--ink-500); text-decoration: none" style-hover="color: var(--ink-900)">Home</a> &nbsp;/&nbsp; <a href="attorneys.dc.html" style="color: var(--ink-500); text-decoration: none" style-hover="color: var(--ink-900)">Attorneys</a> &nbsp;/&nbsp; <span style="color: var(--ink-900)">{{ name }}</span></div>
      <div style="animation: pageRise 1300ms cubic-bezier(0.16,1,0.3,1) 100ms both; display: flex; align-items: center; gap: 28px; margin-top: 26px">
        <div style="width: 110px; height: 110px; border-radius: 9999px; background: var(--paper-100); border: 1px solid var(--ink-100); display: flex; align-items: center; justify-content: center; flex: none; position: relative; overflow: hidden">
          <span style="font-family: var(--font-display); font-size: 36px; font-weight: 700; color: var(--ink-300)">{{ initials }}</span>
          <div style="position: absolute; inset: 0; background-image: {{ photoBg }}; background-size: cover; background-position: center 15%"></div>
        </div>
        <div>
          <h1 style="font-family: var(--font-display); font-size: 42px; font-weight: 700; letter-spacing: -0.02em; margin: 0; color: var(--ink-900)">{{ name }}</h1>
          <div style="display: flex; align-items: center; gap: 12px; margin-top: 10px; flex-wrap: wrap">
            <span style="font-size: 13px; font-weight: 600; color: var(--navy-700); background: var(--paper-0); border: 1px solid var(--ink-100); border-radius: 9999px; padding: 5px 14px">{{ role }}</span>
            <span style="font-size: 14px; color: var(--ink-500)">{{ focus }}</span>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div style="max-width: 1240px; margin: 0 auto; padding: 56px 24px 80px; width: 100%; box-sizing: border-box; display: grid; grid-template-columns: 1fr 340px; gap: 64px; align-items: start">
    <div>
      <sc-for list="{{ paragraphs }}" as="p" hint-placeholder-count="3">
        <p style="font-size: 17px; line-height: 1.75; color: var(--ink-700); margin: 0 0 18px">{{ p }}</p>
      </sc-for>
      <sc-for list="{{ sections }}" as="sec" hint-placeholder-count="4">
        <div style="margin-top: 40px">
          <h2 style="font-family: var(--font-display); font-size: 22px; font-weight: 700; letter-spacing: -0.01em; margin: 0; color: var(--ink-900)">{{ sec.title }}</h2>
          <div style="display: flex; flex-direction: column; margin-top: 6px">
            <sc-for list="{{ sec.items }}" as="it" hint-placeholder-count="4">
              <div style="display: flex; gap: 14px; padding: 12px 0; border-bottom: 1px solid var(--ink-100)">
                <span style="width: 6px; height: 6px; border-radius: 9999px; background: var(--brass-500); flex: none; margin-top: 8px"></span>
                <span style="font-size: 15px; line-height: 1.6; color: var(--ink-700)">{{ it }}</span>
              </div>
            </sc-for>
          </div>
        </div>
      </sc-for>
    </div>

    <div style="position: sticky; top: 130px; border: 1px solid var(--ink-100); border-radius: 14px; padding: 28px; box-shadow: 0 2px 6px rgba(0,0,0,0.04), 0 4px 12px rgba(0,0,0,0.06)">
      <div style="font-size: 13px; font-weight: 600; letter-spacing: 0.14em; text-transform: uppercase; color: var(--brass-700)">Contact {{ firstName }}</div>
      <div style="display: flex; flex-direction: column; gap: 14px; margin-top: 18px">
        <div>
          <div style="font-size: 12px; font-weight: 600; color: var(--ink-500)">Phone</div>
          <a href="{{ telHref }}" style="font-size: 16px; font-weight: 500; color: var(--ink-900); text-decoration: none" style-hover="color: var(--navy-700)">{{ phone }}</a>
        </div>
        <div>
          <div style="font-size: 12px; font-weight: 600; color: var(--ink-500)">Email</div>
          <a href="{{ mailHref }}" style="font-size: 16px; font-weight: 500; text-decoration: none">{{ email }}</a>
        </div>
        <sc-if value="{{ linkedin }}" hint-placeholder-val="{{ false }}">
          <div>
            <div style="font-size: 12px; font-weight: 600; color: var(--ink-500)">LinkedIn</div>
            <a href="{{ linkedin }}" target="_blank" style="font-size: 16px; font-weight: 500; text-decoration: none">View profile</a>
          </div>
        </sc-if>
      </div>
      <div style="display: flex; flex-direction: column; gap: 10px; margin-top: 24px">
        <a href="contact.dc.html" style="display: block; text-align: center; background: var(--navy-700); color: var(--paper-0); border-radius: 9999px; padding: 14px 24px; font-size: 15px; font-weight: 600; text-decoration: none" style-hover="background: var(--navy-900)">Schedule a consultation</a>
        <a href="attorneys.dc.html" style="display: block; text-align: center; border: 1px solid var(--ink-200); color: var(--ink-900); border-radius: 9999px; padding: 13px 24px; font-size: 15px; font-weight: 600; text-decoration: none" style-hover="background: var(--paper-50)">All attorneys</a>
      </div>
    </div>
  </div>

  <dc-import name="SiteFooter" hint-size="100%,420px"></dc-import>
</div>
</x-dc>
